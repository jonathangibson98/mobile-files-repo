name: Mobile Files
version: "1.1.0"
slug: mobile_files
description: Phone-friendly file manager, text editor and Samba admin with full filesystem access
url: https://github.com/jonathangibson98/mobile-files-repo
arch:
  - amd64
  - aarch64
  - armv7
init: false
startup: services
boot: auto
ingress: true
ingress_port: 8080
panel_icon: mdi:folder-network
panel_title: Files
panel_admin: true
ports:
  8080/tcp: null
  445/tcp: 445
  139/tcp: 139
map:
  - config:rw
  - share:rw
  - media:rw
  - backup:rw
  - ssl:rw
  - addons:rw
  - all_addon_configs:rw
options:
  admin_user: admin
  admin_password: ""
  root_path: /
  hide_from_web: []
  hide_from_samba: []
  samba_enabled: true
  puid: 0
  pgid: 0
schema:
  admin_user: str
  admin_password: password?
  root_path: str
  hide_from_web:
    - str
  hide_from_samba:
    - str
  samba_enabled: bool
  puid: int
  pgid: int
