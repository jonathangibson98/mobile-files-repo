services:
  mobile-files:
    image: ghcr.io/jonathangibson98/mobile-files-repo:latest   # prebuilt (amd64 + arm64)
    # build: .                           # or build it yourself from this folder instead
    container_name: mobile-files
    restart: unless-stopped
    environment:
      ADMIN_USER: admin
      ADMIN_PASSWORD: change-me          # web UI login. Change this!
      PUID: 1000                         # owner of files created via UI/Samba
      PGID: 1000
      TZ: Etc/UTC                        # your time zone, e.g. America/Chicago
      # The four below only set the first-start values. After that, change them in the web UI's Settings tab.
      # SAMBA_ENABLED: "0"               # set to 0 to run the web file manager only
      # HIDE_FROM_WEB: "*.db, /private"  # hidden AND blocked in the web UI (comma separated)
      # HIDE_FROM_SAMBA: "*.db, .cache"  # names hidden in Samba listings (comma separated)
      # TRASH_DIR: ""                    # empty = no Trash, deletes are permanent
                                         # default: /data/.mobile_files_trash
    ports:
      - "8080:8080"                      # web UI
      - "445:445"                        # SMB
      - "139:139"                        # NetBIOS session (older clients)
    volumes:
      - ./data:/data                     # files you want to browse/share
      - ./config:/config                 # web UI + Samba settings (config.json)
      - samba-db:/var/lib/samba          # Samba password database

    # Optional: host networking makes the server show up in Windows/macOS network
    # discovery (needs nmbd broadcasts). If you use it, delete the `ports:` block.
    # network_mode: host

volumes:
  samba-db:
